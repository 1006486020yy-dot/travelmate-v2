name: Ensure TravelMate share runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-share-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Expose itinerary plans and load share runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # The share runtime needs access to the same plan objects used by the page.
          # Convert the app's local P declaration into a window property without changing the data itself.
          import re
          s2 = re.sub(r'(?<![\w$])const\s+P\s*=', 'window.P =', s, count=1)
          if s2 == s:
              s2 = re.sub(r'(?<![\w$])let\s+P\s*=', 'window.P =', s, count=1)
          s = s2
          tag = '<script src="./share-runtime-v5.js?v=20260814-final"></script>'
          # Remove any previous versions of the runtime so there is exactly one active copy.
          s = re.sub(r'<script[^>]+share-runtime-v5\.js[^>]*></script>', '', s)
          marker = '</body>'
          if marker in s:
              s = s.replace(marker, tag + marker, 1)
          else:
              s += tag
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: expose itinerary data for sharing'
            git push
          fi
