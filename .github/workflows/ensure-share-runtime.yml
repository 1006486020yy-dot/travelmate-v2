name: Ensure TravelMate share runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-share-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject share runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./share-runtime-v5.js?v=20260814"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + marker, 1)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Share runtime already loaded.'
          else
            git commit -m 'fix: load share runtime in index'
            git push
          fi
