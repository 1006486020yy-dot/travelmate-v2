name: Inject TravelMate share feature

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject share runtime into index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./share-runtime.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+marker, 1)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git commit -m "chore: enable trip sharing"
          git push
