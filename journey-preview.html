<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅伴旅行管家 · 行程模块预览</title>
<style>
:root{--bg:#f4f6f8;--ink:#18232f;--muted:#7c8793;--glass:rgba(255,255,255,.76);--line:rgba(255,255,255,.92);--purple:#7457d9;--green:#5d9b73;--shadow:0 18px 50px rgba(30,43,58,.10);--r:25px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 400px at 5% 0%,#e8e0ff,transparent 55%),radial-gradient(700px 420px at 100% 20%,#dff4e7,transparent 55%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--ink)}button{font:inherit;border:0;cursor:pointer}.app{max-width:1180px;margin:auto;padding-bottom:110px}.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(244,246,248,.72);backdrop-filter:blur(28px)}.brand{font-weight:900;font-size:20px;letter-spacing:1px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#e9e3ff);box-shadow:0 8px 24px #26354a16}main{padding:18px}.crumb{font-size:13px;color:var(--muted);margin:8px 0 15px}.crumb b{color:var(--ink)}.hero{padding:24px;border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(247,244,255,.72));border:1px solid var(--line);box-shadow:var(--shadow)}.heroTop{display:flex;justify-content:space-between;gap:15px}.eyebrow{font-size:12px;color:var(--purple);font-weight:800}.hero h1{margin:8px 0 7px;font-size:30px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:13px}.add{padding:11px 15px;border-radius:16px;background:linear-gradient(135deg,var(--purple),#9b7bea);color:#fff;font-weight:800;box-shadow:0 10px 25px #7457d938;white-space:nowrap}.planTabs{display:flex;gap:9px;margin:15px 0;overflow:auto;padding:2px}.plan{min-width:180px;padding:15px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:0 9px 25px #26354a0a;text-align:left}.plan b{display:block;font-size:14px}.plan small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.plan.active{background:linear-gradient(135deg,#7659da,#8e72e5);color:#fff;transform:translateY(-2px);box-shadow:0 13px 30px #7457d93a}.plan.active small{color:#eee}.days{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 12px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{min-width:91px;padding:13px 10px;border-radius:19px;background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 8px 24px #26354a09;text-align:center;transition:.2s}.day:active{transform:scale(.95)}.day small{display:block;color:var(--muted);font-size:10px}.day b{display:block;font-size:14px;margin-top:4px}.day em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:4px}.day.active{background:linear-gradient(145deg,var(--purple),#9a7ae7);color:#fff;box-shadow:0 12px 28px #7457d934}.day.active small,.day.active em{color:#eee}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:15px}.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(22px);padding:18px}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panelHead h2{margin:0;font-size:19px}.panelHead span{font-size:11px;color:var(--muted)}.timeline{position:relative;padding-left:78px}.timeline:before{content:"";position:absolute;left:37px;top:15px;bottom:18px;width:2px;background:#ded9ef}.item{position:relative;margin:0 0 12px;padding:16px;border-radius:20px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.96);box-shadow:0 8px 22px #26354a09}.item:before{content:"";position:absolute;left:-46px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 5px #ece7ff}.time{position:absolute;left:-75px;top:17px;width:58px;text-align:right;font-size:12px;font-weight:800;color:var(--purple)}.item h3{margin:0;font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.address{margin-top:9px;font-size:12px;line-height:1.55;color:#65717e}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.act{padding:8px 10px;border-radius:12px;background:#f0f2f5;color:#596674;font-size:11px}.act.primary{background:#eee9ff;color:#644bc2;font-weight:800}.sideBlock{padding:15px;border-radius:19px;background:rgba(255,255,255,.58);margin-bottom:10px}.sideBlock b{font-size:13px}.sideBlock p{font-size:12px;color:var(--muted);line-height:1.6;margin:7px 0 0}.budget{font-size:26px;font-weight:900;margin-top:6px}.green{color:var(--green)}.hotel{border-left:4px solid var(--green)}.transport{border-left:4px solid #6d8fd6}.bottom{position:fixed;z-index:30;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 22px));padding:7px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.78);backdrop-filter:blur(28px);border:1px solid #fff;border-radius:25px;box-shadow:0 18px 48px #26354a1a}.bottom button{background:transparent;color:#87929e;padding:7px;border-radius:17px;font-size:10px}.bottom button.active{color:var(--purple);background:#eeeaff;font-weight:800}.ico{display:block;font-size:19px;margin-bottom:2px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#202936eF;color:#fff;padding:10px 15px;border-radius:14px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){main{padding:13px}.hero{padding:20px}.heroTop{display:block}.add{margin-top:14px}.layout{display:block}.side{margin-top:13px}.panel{padding:15px}.item{padding:14px}.hero h1{font-size:27px}.plan{min-width:210px}.day{min-width:82px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">旅伴<small>TRAVELMATE</small></div><div class="avatar">✦</div></header>
<main>
<div class="crumb">我的行程　›　<b>十一福建游</b>　›　方案A</div>
<section class="hero"><div class="heroTop"><div><div class="eyebrow">正在查看 · 方案 A</div><h1>福州 + 平潭 + 泉州 + 厦门</h1><p>9月28日 — 10月4日　·　7天　·　2人</p></div><button class="add" onclick="toast('新建方案入口已准备')">＋ 新建方案</button></div></section>
<div class="planTabs"><button class="plan active"><b>方案A</b><small>福州+平潭+泉州+厦门四城完整版</small></button><button class="plan" onclick="switchPlan(this)"><b>方案B</b><small>福州+平潭+厦门三城休闲版</small></button><button class="plan" onclick="toast('可以继续创建方案C')"><b>＋ 方案C</b><small>新建旅行方案</small></button></div>
<div class="days" id="days"></div>
<div class="layout"><section class="panel"><div class="panelHead"><h2 id="dayTitle">DAY 0 · 9月28日</h2><span>福州</span></div><div class="timeline" id="timeline"></div></section><aside class="side"><div class="panel"><div class="panelHead"><h2>当天信息</h2><span>DAY 0</span></div><div class="sideBlock"><b>📍 城市</b><p>福州</p></div><div class="sideBlock"><b>🏨 酒店</b><p>锦江都城酒店（福州三坊七巷东街口地铁站店）<br>福州市鼓楼区省府路9号</p><div class="actions"><button class="act" onclick="copyText('锦江都城酒店（福州三坊七巷东街口地铁站店）')">复制名称</button><button class="act" onclick="copyText('福州市鼓楼区省府路9号')">复制地址</button><button class="act primary" onclick="nav('福州市鼓楼区省府路9号')">导航</button></div></div><div class="sideBlock"><b>💰 当天预算</b><div class="budget">¥300</div><p>酒店 ¥300 · 其他待添加</p></div><button class="add" style="width:100%" onclick="toast('添加日程 Bottom Sheet')">＋ 添加到这一天</button></div></aside></div>
</main></div>
<nav class="bottom"><button class="active"><span class="ico">⌂</span>首页</button><button><span class="ico">▣</span>行程</button><button><span class="ico">⌖</span>景点</button><button><span class="ico">♨</span>美食</button><button><span class="ico">●</span>我的</button></nav><div class="toast" id="toast"></div>
<script>
const days=[['DAY 0','9月28日','福州'],['DAY 1','9月29日','福州→平潭'],['DAY 2','9月30日','平潭北线'],['DAY 3','10月1日','平潭→泉州'],['DAY 4','10月2日','泉州→厦门'],['DAY 5','10月3日','鼓浪屿'],['DAY 6','10月4日','厦门→返程']];
const data=[
[{t:'晚间',n:'抵达福州',a:'福州长乐国际机场',note:'9月28日晚抵达福州，前往酒店休息。',type:'交通'}],
[{t:'09:00',n:'三坊七巷',a:'福州市鼓楼区南后街',note:'街区免费；故居联票30元。',type:'景点'},{t:'12:50',n:'福州 → 平潭',a:'福州站 → 平潭站',note:'前往平潭，下午安排南线。',type:'火车'},{t:'15:30',n:'猴研岛（68海里景区）',a:'平潭县澳前镇东澳村',note:'门票35元；摆渡车往返20元。',type:'景点'}],
[{t:'08:30',n:'仙人井（东海仙境）',a:'平潭县流水镇东海仙境景区',note:'北线第一站，礁石湿滑注意防滑。',type:'景点'},{t:'10:00',n:'镜沙黑沙滩',a:'平潭县流水镇镜沙村',note:'免费，查潮汐后再靠近海蚀洞。',type:'景点'},{t:'11:00',n:'北港文创村',a:'平潭县流水镇北港文创村',note:'石头厝与渔村小巷。',type:'景点'},{t:'17:30',n:'长江澳风车田',a:'平潭县芦洋乡长江澳沙滩',note:'平潭经典日落点。',type:'景点'}],
[{t:'09:00',n:'龙王头海滨浴场',a:'平潭县潭城镇城东',note:'免费，适合看日出。',type:'景点'},{t:'12:00',n:'平潭 → 泉州',a:'平潭 → 泉州',note:'下午进入泉州古城。',type:'交通'},{t:'17:00',n:'开元寺',a:'泉州市鲤城区西街176号',note:'园区免费；东西塔登塔20元。',type:'景点'}],
[{t:'09:00',n:'泉州海边路线',a:'泉州市区 → 蟳埔村',note:'上午安排泉州海边与蟳埔。',type:'景点'},{t:'15:30',n:'泉州 → 厦门',a:'泉州 → 厦门',note:'前往厦门入住。',type:'交通'}],
[{t:'08:30',n:'鼓浪屿',a:'厦门市思明区鼓浪屿',note:'邮轮中心厦鼓码头乘船，往返船票35元。',type:'景点'},{t:'12:00',n:'龙头路小吃',a:'厦门市思明区鼓浪屿龙头路',note:'岛上步行游览，平底鞋更舒适。',type:'美食'}],
[{t:'09:00',n:'南普陀寺',a:'厦门市思明区思明南路515号',note:'预约免费。',type:'景点'},{t:'10:30',n:'厦门植物园',a:'厦门市思明区虎园路25号',note:'门票30元。',type:'景点'},{t:'13:00',n:'厦门火车站 / 返程',a:'厦门市思明区厦禾路',note:'根据返程车次安排时间。',type:'交通'}]
];
const daysEl=document.getElementById('days'); const tl=document.getElementById('timeline'); const title=document.getElementById('dayTitle');
function renderDays(){daysEl.innerHTML=days.map((d,i)=>`<button class="day ${i===0?'active':''}" onclick="selectDay(${i},this)"><small>${d[0]}</small><b>${d[1]}</b><em>${d[2]}</em></button>`).join('')}
function render(i){title.textContent=`${days[i][0]} · ${days[i][1]}`;tl.innerHTML=data[i].map((x,j)=>`<article class="item"><div class="time">${x.t}</div><h3>${x.n}</h3><div class="meta">${x.type} · ${days[i][2]}</div><div class="address">📍 ${x.a}</div><div class="meta">${x.note}</div><div class="actions"><button class="act" onclick="copyText('${x.n.replaceAll("'","\\'")}')">复制名称</button><button class="act" onclick="copyText('${x.a.replaceAll("'","\\'")}')">复制地址</button><button class="act primary" onclick="nav('${x.a.replaceAll("'","\\'")}')">导航</button><button class="act" onclick="toast('编辑：${x.n}')">编辑</button></div></article>`).join('')}
function selectDay(i,el){document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(i)}
function switchPlan(el){document.querySelectorAll('.plan').forEach(x=>x.classList.remove('active'));el.classList.add('active');toast('已切换到方案B预览')}
function copyText(t){navigator.clipboard?.writeText(t);toast('已复制：'+t)}
function nav(a){window.open('https://uri.amap.com/search?keyword='+encodeURIComponent(a),'_blank');}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}
renderDays();render(0);
</script>
</body></html>
